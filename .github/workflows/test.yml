name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install neovim
        run: |
          brew install neovim
          nvim --version

      - name: Test and build the preview page
        run: |
          cd web || exit 1
          bun install --frozen-lockfile
          bun test
          bun run build

      - name: Swift tests
        run: swift test

      - name: Installer tests
        run: sh scripts/tests/install-test.sh
