name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build and smoke-test, as X.Y.Z (a dry run: nothing is published)'
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Work out the version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=${GITHUB_REF_NAME#v}
          else
            version=$INPUT_VERSION
          fi
          case $version in
            *[!0-9.]* | .* | *. | *..* | '') echo "version '$version' is not X.Y.Z" >&2; exit 1 ;;
          esac
          if [ "$(printf '%s' "$version" | tr -cd . | wc -c)" -ne 2 ]; then
            echo "version '$version' is not X.Y.Z" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - uses: oven-sh/setup-bun@v2

      - name: Install neovim
        run: brew install neovim

      - name: Build the release archive
        run: scripts/build-release.sh "$VERSION"

      - name: Installer tests
        run: sh scripts/tests/install-test.sh

      - name: Smoke test the archive
        run: |
          unpacked=$(mktemp -d)
          tar -xzf dist/scwrote-macos.tar.gz -C "$unpacked"
          scripts/smoke-test.sh "$unpacked/scwrote/share/scwrote/Scwrote"

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/scwrote-macos.tar.gz

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/scwrote-macos.tar.gz dist/scwrote-macos.tar.gz.sha256 \
            --generate-notes --verify-tag
