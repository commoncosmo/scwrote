name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build and smoke-test, as X.Y.Z (a dry run: nothing is published)'
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Work out the version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version=${GITHUB_REF_NAME#v}
          else
            version=$INPUT_VERSION
          fi
          case $version in
            *[!0-9.]* | .* | *. | *..* | '') echo "version '$version' is not X.Y.Z" >&2; exit 1 ;;
          esac
          if [ "$(printf '%s' "$version" | tr -cd . | wc -c)" -ne 2 ]; then
            echo "version '$version' is not X.Y.Z" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install neovim
        run: |
          brew install neovim
          nvim --version

      - name: Build the release archive
        run: scripts/build-release.sh "$VERSION"

      - name: Installer tests
        run: sh scripts/tests/install-test.sh

      - name: Install the archive into a temporary prefix
        run: |
          prefix=$(mktemp -d)
          PREFIX="$prefix" SCWROTE_ARCHIVE="$PWD/dist/scwrote-macos.tar.gz" sh install.sh
          got=$("$prefix/bin/scwrote" --version)
          if [ "$got" != "scwrote $VERSION" ]; then
            echo "installed launcher reports '$got', expected 'scwrote $VERSION'" >&2
            exit 1
          fi
          echo "INSTALL_PREFIX=$prefix" >> "$GITHUB_ENV"

      - name: Smoke test the installed app
        run: scripts/smoke-test.sh "$INSTALL_PREFIX/share/scwrote/Scwrote"

      - uses: actions/upload-artifact@v7
        with:
          name: release-archive
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-archive
          path: dist

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/scwrote-macos.tar.gz

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/scwrote-macos.tar.gz dist/scwrote-macos.tar.gz.sha256 \
            --generate-notes --verify-tag --repo "$GITHUB_REPOSITORY"
