<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
  Only scwrote's own scripts run: no inline scripts, no eval. User markdown may
  hold raw HTML; its scripts and event handlers never run. mermaid.min.js needs
  nothing beyond this (its SVG <style> blocks fall under style-src
  'unsafe-inline').
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src scwrote-app:; style-src scwrote-app: 'unsafe-inline'; img-src scwrote-app: scwrote-file: data: blob:; font-src scwrote-app: scwrote-file: data:">
<!-- Markdown moves this to the file's folder, so relative links and images resolve there. -->
<base href="scwrote-app:///">
<link rel="stylesheet" href="page.css">
<script defer src="mermaid.min.js"></script>
<script defer src="page.js"></script>
</head>
<body>
<main id="content"></main>
<div id="cursor-bar" hidden></div>
</body>
</html>
